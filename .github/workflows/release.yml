name: Release to Maven Central

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.3, v1.1.0, etc.

jobs:
  # Release gate: the bridge must match the tiro-web-sdk bundle this release embeds and
  # serves (GH-24) before we publish. If it doesn't, this job fails and `publish` (which
  # needs it) is skipped — the release is blocked.
  #
  # The version checked is the pin in build/web-sdk/package.json, not a dist-tag: the
  # released jar carries that exact bundle, so it is the only pairing a deployment can run.
  # See build/bridge-contract/README.md.
  contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiro-health'

      - name: Install tooling
        working-directory: build/bridge-contract
        run: npm ci

      # Belt-and-braces alongside WebSdkAssetsTest: a release must never ship a jar whose
      # staged bundle disagrees with the pin the bridge was type-checked against.
      - name: Resolve and verify the embedded SDK version
        id: pin
        run: |
          PIN=$(node -p "require('./build/web-sdk/package.json').dependencies['@tiro-health/web-sdk']")
          STAGED=$(node -p "require('./form-filler-swing/src/main/resources/health/tiro/formfiller/swing/web-sdk.version.json').version")
          if [ "$PIN" != "$STAGED" ]; then
            echo "::error::The pin ($PIN) and the staged bundle ($STAGED) disagree. Run build/web-sdk/copy-bundle.mjs and commit the result."
            exit 1
          fi
          echo "version=$PIN" >> "$GITHUB_OUTPUT"
          echo "Bridge contract validated against the **embedded tiro-web-sdk v$PIN**." >> "$GITHUB_STEP_SUMMARY"

      - name: Install the pinned @tiro-health/web-sdk
        working-directory: build/bridge-contract
        run: npm install --no-save "@tiro-health/web-sdk@${{ steps.pin.outputs.version }}"

      - name: Type-check bridge against frontend contract
        working-directory: build/bridge-contract
        run: npm run typecheck

  publish:
    needs: contract-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central # Matches the <publishingServerId> in your pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Sync POM version with Tag
        run: |
          # Extracts '1.0.3' from 'refs/tags/v1.0.3'
          NEW_VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/v,,')
          echo "Setting POM version to $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false -DprocessAllModules

      - name: Publish to Maven Central
        run: mvn clean deploy -P release -B
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}