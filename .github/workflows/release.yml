name: Release to Maven Central

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.3, v1.1.0, etc.

jobs:
  # Release gate: the bridge must match the current stable frontend
  # (@tiro-health/web-sdk@latest) before we publish. If it doesn't, this job fails and
  # `publish` (which needs it) is skipped — the release is blocked.
  #
  # This is intentionally BLOCKING. While the save-draft submit({ status }) API is only
  # on web-sdk >= 0.3.0 (not yet on the `latest` dist-tag), this gate fails and blocks
  # releases by design — until 0.3.0 is promoted to `latest`, or the bridge stops calling
  # an API absent from stable. See build/bridge-contract/README.md.
  contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: build/bridge-contract
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiro-health'

      - name: Install tooling
        run: npm ci

      - name: Install @tiro-health/web-sdk@latest
        run: npm install --no-save @tiro-health/web-sdk@latest

      - name: Record validated SDK version
        run: |
          VER=$(npm view @tiro-health/web-sdk version)
          echo "Validating bridge against tiro-web-sdk@$VER (latest dist-tag)"
          echo "Bridge contract validated against **tiro-web-sdk v$VER** (this version or higher, same major, supported)." >> "$GITHUB_STEP_SUMMARY"

      - name: Type-check bridge against frontend contract
        run: npm run typecheck

  publish:
    needs: contract-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central # Matches the <publishingServerId> in your pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Sync POM version with Tag
        run: |
          # Extracts '1.0.3' from 'refs/tags/v1.0.3'
          NEW_VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/v,,')
          echo "Setting POM version to $NEW_VERSION"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false -DprocessAllModules

      - name: Publish to Maven Central
        run: mvn clean deploy -P release -B
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}